# golangci-lint configuration for ompig-slim.
#
# Purpose: gate NEW and changed code strictly. The existing tree is clean
# (docs/quality-discovery.md), so most rules gate the diff via
# `new-from-rev`; counts of existing debt live in docs/quality-baseline.md.
#
# Calibrated from docs/quality-discovery.md, not from defaults. Every enabled
# linter has a one-line reason. Linter names verified against
# `golangci-lint` 2.x `linters` output.
version: "2"

run:
  timeout: 5m

linters:
  # Start from nothing; enable deliberately.
  default: none
  enable:
    # --- Correctness -------------------------------------------------------
    - govet          # canonical suspicious-construct checks; go vet already passes
    - staticcheck    # bug-prone + perf simplifications; repo is largely clean
    - errcheck       # unchecked errors; check-blank+assertions catches sloppy AI code
    - errorlint      # %w/%v wrapping and errors.Is/As discipline the repo already uses
    - nilerr         # returning nil after checking err != nil — a classic AI bug
    - ineffassign    # dead assignments hide real intent
    - copyloopvar    # Go<1.22 loop-var capture; go.mod is 1.27 but guards ports
    - exhaustive     # enum switches must handle all members; auth/goal bugs love this
    # --- Error / context hygiene ------------------------------------------
    - wrapcheck      # external errors should be wrapped with context (repo convention)
    - contextcheck   # non-inherited ctx inside a ctx-taking call chain
    - noctx          # net/http + os/exec without context.Context; repo always passes one
    - bodyclose      # HTTP response bodies must close; broker/selfupdate use net/http
    # --- Workaround / sloppy-AI detectors ---------------------------------
    - nolintlint     # no unexplained or blanket //nolint; require-explanation+specific
    - godox          # TODO/FIXME/HACK/XXX left behind; baseline has zero
    - forbidigo      # ban time.Sleep / fmt.Print* / panic / log.Fatal — see settings
    - gochecknoglobals  # no new package-level mutable state; baseline ~16
    - gochecknoinits    # no init(); baseline has zero (blank imports are not init)
    - nakedret       # naked returns in long functions are hard to audit
    # --- Complexity / duplication -----------------------------------------
    - gocognit       # cognitive complexity; p90=19, p99=48 -> cap 40
    - cyclop         # cyclomatic; p90=22, p95=29, p99=42 -> cap 30
    - funlen         # all functions <60 lines today -> cap 80/50
    - nestif         # deep if-nesting; p99=2 -> cap 5
    - dupl           # clone detection; 19 blocks >=40 tok -> cap 150
    - goconst        # repeated literal strings the repo centralizes anyway
    # mnd is deliberately OFF: the repo legitimately uses file-mode, timeout and
    # HTTP-status literals inline; it produced 52 mostly-justified hits for
    # little signal. See docs/quality-baseline.md.
    # --- Dead code ---------------------------------------------------------
    - unused         # unused symbols; repo is clean
    - unparam        # unused/always-same params; one benign hit today
    # --- Performance -------------------------------------------------------
    - prealloc       # sized slice growth in loops
    - perfsprint     # Sprintf that should be strconv/faster form
    - gocritic       # diagnostic+performance+style; tuned below
    # --- Security ----------------------------------------------------------
    - gosec          # credential/crypto/exec paths benefit; audit into baseline
    # --- Tests -------------------------------------------------------------
    - thelper        # test helpers must call t.Helper; repo convention
    - tparallel      # correct t.Parallel usage if/when used
    # --- Formatting / style ------------------------------------------------
    - misspell       # common typos
    - whitespace     # stray blank lines at block edges
    - usestdlibvars  # prefer stdlib vars (http.MethodGet etc.)
    - mirror         # bytes/strings mirror misuse
    - dupword        # duplicated words in comments/strings
    - embeddedstructfieldcheck  # embedded field ordering
    - exptostd       # golang.org/x/exp that should be stdlib now
    - gocheckcompilerdirectives # malformed //go: directives
    - revive         # exported-docs + a few correctness rules; tuned below

  settings:
    errcheck:
      # Discard-into-blank and unchecked type assertions are the AI slop we care about.
      check-blank: true
      check-type-assertions: true
      # The repo's idiomatic safe discards stay allowed. Only signatures that are
      # genuinely non-actionable in context are listed; everything else must
      # handle the error (or justify a discard in the baseline).
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - io.WriteString
        - (*bytes.Buffer).WriteString
        - (*encoding/json.Encoder).Encode   # headers already sent; nothing to do
        - (*github.com/gofrs/flock.Flock).Unlock  # release-side cleanup
        - io.Copy                            # drain-to-Discard for conn reuse
        - os.Remove                          # best-effort temp cleanup
        - (*os.File).Close                   # defer cleanup
        - (os.File).Close

    wrapcheck:
      # Only flag external-package errors returned bare; internal and sentinel
      # errors need no wrap. The repo wraps I/O boundary errors but returns
      # stdlib filesystem/serialization errors bare, so ignore those signatures
      # and keep wrapcheck for the network/broker/HTTP boundaries.
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - errors.Is(
        - errors.As(
        - os.
        - os/
        - encoding/json.
        - io/fs.
        - path/filepath.
        - strconv.
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
      ignore-package-globs:
        - ompig-slim/*
        - github.com/MichaelKinsy/PiG/*

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    exhaustive:
      # Keep default-signaling explicit; repo's enum switches (goal state,
      # conflict choices) must stay total.
      default-signifies-exhaustive: false

    forbidigo:
      forbid:
        # time.Sleep in production code is a timing workaround; tests keep it.
        - pattern: '\btime\.Sleep\b'
          msg: "use a condition/channel/deadline instead of time.Sleep; if a retry is needed, loop on a predicate"
        # The repo writes diagnostics to an explicit io.Writer (os.Stderr/Stderr
        # param), never to stdout defaults or a logger.
        - pattern: '\bfmt\.Print(ln|f)?\('
          msg: "write to the explicit io.Writer passed in (os.Stdout/os.Stderr), not fmt.Print*"
        - pattern: '\bpanic\('
          msg: "return an error; do not panic. If this is a true invariant, document it"
        - pattern: '\blog\.Fatal'
          msg: "return the error to the caller which owns process exit"
        - pattern: '\bos\.Exit\('
          msg: "return an exit code to main; only main/Handle* may call os.Exit"
        # stdlib tests only; testify is not a dependency (go.mod).
        - pattern: '"github\.com/stretchr/testify'
          msg: "tests use the standard library only; add table-driven cases + t.Helper helpers"
        # No logger package; diagnostics go to io.Writer.
        - pattern: '"log/slog"'
          msg: "this repo has no logger; write diagnostics to the explicit io.Writer (see internal/broker/migrate.go)"
      exclude-godoc-examples: false

    godox:
      keywords: [TODO, FIXME, HACK, XXX, WORKAROUND]

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    gocognit:
      # p90=19, p99=48 (measured). Cap at 40: above that a function is doing
      # more than one thing and becomes the class of bug the history shows.
      min-complexity: 40

    cyclop:
      # p90=22, p95=29, p99=42, max=56. Cap at 30 ≈ p95.
      max-complexity: 30
      package-average: 0

    funlen:
      # Every function today is <60 lines / <40 statements except three stable
      # entry/dispatch functions (see baseline). 100/60 leaves headroom while
      # blocking the AI wall-of-code pattern.
      lines: 100
      statements: 60
      ignore-comments: true

    nestif:
      # p99=2; deep nesting is rare and signals untangled branches.
      min-complexity: 5

    dupl:
      # 19 blocks >=40 tokens today (mostly test-table shapes). 150 tokens keeps
      # real clones gated without drowning in fixture boilerplate.
      threshold: 150

    goconst:
      min-occurrences: 3
      ignore-tests: false

    unparam:
      check-exported: false

    gocritic:
      # Focus on correctness and perf, not style nits the repo doesn't follow.
      enabled-tags: [diagnostic, performance]
      disabled-checks:
        - hugeParam   # repo passes medium structs by value routinely
        - rangeValCopy
        - paramTypeCombine
        - sloppyReassign  # err= vs err:= is stylistic; repo prefers reuse
      settings:
        captLocal:
          paramsOnly: true

    gosec:
      excludes:
        - G104   # errcheck already covers unhandled errors with better messages
        - G306   # repo intentionally writes credential files 0600 via privatefs
        - G304   # file paths from user config are the feature, not a bug

    nakedret:
      max-func-lines: 30

    revive:
      enable-all-rules: false
      rules:
        - name: exported
        - name: package-comments
        - name: indent-error-flow
        - name: early-return
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: time-equal
        - name: string-of-int

  exclusions:
    # Generated/vendored code is out of scope (none in root, but belt+braces).
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor
      - third_party
      - _test\.go$            # complexity/format rules don't gate tests as hard
    rules:
      # Tests legitimately discard errors, sleep, and use helpers heavily.
      - path: _test\.go$
        linters: [errcheck, forbidigo, goconst, dupl, funlen, gocognit, cyclop, nestif, mnd, gosec, gochecknoglobals]
      # Main entry points may use os.Exit / context.Background legitimately.
      - path: (^|/)main\.go$
        linters: [forbidigo]
      - path: cmd/ompig-slim-broker/main\.go$
        linters: [forbidigo, wrapcheck]
      # selfupdate's replace path retries on a timer on Windows by design.
      - path: replace_windows\.go$
        linters: [forbidigo]

issues:
  # Report every finding so baseline counts are honest and diffs can't hide
  # behind per-linter caps.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party
