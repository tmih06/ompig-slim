<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title description">
  <title id="title">OMPi in GO-slim</title>
  <desc id="description">The ompig-slim startup logo in its original white, coral, blue, yellow, and purple brand colors.</desc>
  <rect width="1000" height="250" rx="24" fill="#111c2a"/>
  <g transform="translate(215 84) scale(20)" shape-rendering="crispEdges">
    <!-- White OM prefix, drawn from the startup logo's four-row block glyphs. -->
    <path fill="#ececec" d="M0 0h3v1H0z M0 1h1v2H0z M2 1h1v2H2z M0 3h3v1H0z M4 0h1v4H4z M8 0h1v4H8z M5 1h1v1H5z M7 1h1v1H7z M6 2h1v1H6z"/>
    <!-- Pi mark: coral upper P, blue stem/base, and yellow i. -->
    <path fill="#e48a7a" d="M10 0h3v1h-3z M12 1h1v1h-1z"/>
    <path fill="#4f8eb3" d="M10 1h1v3h-1z M10 2h2v1h-2z"/>
    <path fill="#eab65d" d="M12 2h1v2h-1z"/>
    <!-- Go wordmark, using the startup's cyan block-letter G and O. -->
    <path fill="#00add8" d="M18 0h3v1h-3z M18 1h1v2h-1z M20 2h1v1h-1z M18 3h3v1h-3z M22 0h3v1h-3z M22 1h1v2h-1z M24 1h1v2h-1z M22 3h3v1h-3z"/>
    <!-- The logo places `in` between the two rows of GO. -->
    <text x="15" y="3.55" fill="#ececec" font-family="ui-sans-serif, system-ui, sans-serif" font-size="1.45" font-weight="650" letter-spacing="-.04">in</text>
    <!-- Startup product tag, in the logo's original light purple. -->
    <text x="26" y="1.05" fill="#c6a0f6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="1.1" font-weight="600">-slim</text>
  </g>
</svg>
