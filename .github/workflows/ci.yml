name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GO_VERSION: '1.27.3'
  GOTOOLCHAIN: local

jobs:
  check:
    needs: release
    name: Tests, vet, race and smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Restore Go build, test and vet caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ hashFiles('go.mod', 'go.sum', 'vendor/**', 'vendor/modules.txt', '*.go', 'scripts/**', '.github/workflows/**') }}
          restore-keys: |
            go-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-
      # A cache hit never skips commands. Go checks source, dependencies, build
      # flags and observed test inputs before reusing a successful result.
      - name: Check script compatibility with the platform Bash
        run: python3 scripts/test-check-go.py
      - name: Test benchmark fixtures, accounting and reporting
        run: python3 -m unittest discover -s scripts -p 'test_benchmark.py'
      - name: Test the curl installer against a loopback release server
        run: python3 scripts/test-install.py -v
      - run: make check
      - run: make race
      - name: Download the already-built release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-archives
          path: bin/releases
      - name: Extract this runner's native executable
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in x86_64) arch=x64 ;; aarch64|arm64) arch=arm64 ;; *) exit 1 ;; esac
          tar -xzf "bin/releases/ompig-slim-$os-$arch.tar.gz" -C bin
          mv bin/ompig-slim/ompig-slim bin/ompig-slim-executable
          rm -r bin/ompig-slim
          mv bin/ompig-slim-executable bin/ompig-slim
      - run: make smoke-built
      - name: Prove update and upgrade replace an installed release
        run: python3 scripts/test-self-update.py ./bin/ompig-slim
      - name: Verify startup accepts and paints early input
        run: |
          profile="$(mktemp -d)"
          trap 'rm -rf "$profile"' EXIT
          PI_OFFLINE=1 PI_SKIP_VERSION_CHECK=1 python3 scripts/measure-startup.py ./bin/ompig-slim --agent-dir "$profile" --cwd "$profile" --runs 1
      - run: ./bin/ompig-slim --version
      - run: ./bin/ompig-slim --help

  benchmark:
    name: Serial CLI comparison (median of five long sessions)
    needs: [release, check, hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-archives
          path: archives
      - name: Extract the verified Linux build (no Go toolchain or rebuild)
        run: |
          cd archives
          sha256sum --check ompig-slim-linux-x64.tar.gz.sha256
          tar -xzf ompig-slim-linux-x64.tar.gz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.4.4'
      - name: Install pinned OMP and original Pi on the runner
        run: |
          npm ci --prefix benchmarks/omp --no-audit --no-fund
          npm ci --prefix benchmarks/pi --no-audit --no-fund
      - name: Benchmark the existing artifact against installed upstream CLIs
        run: >-
          python3 scripts/benchmark.py --slim archives/ompig-slim/ompig-slim
          --runs 5 --warmups 1 --turns 120 --resume-turns 12
      - name: Publish median comparison
        if: always()
        run: |
          if [[ -f benchmark-results/summary.md ]]; then
            cat benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain raw runs and sampled resource timelines
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30

  hygiene:
    name: Workflow, scripts and full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACTIONLINT_VERSION: v1.7.12
      GITLEAKS_VERSION: v8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Restore pinned CI tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ompig-ci-tools
          key: tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ env.ACTIONLINT_VERSION }}-${{ env.GITLEAKS_VERSION }}
      - name: Install missing tools
        run: |
          mkdir -p "$HOME/.cache/ompig-ci-tools"
          export GOBIN="$HOME/.cache/ompig-ci-tools"
          if [[ ! -x "$GOBIN/actionlint" ]]; then
            go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          fi
          if [[ ! -x "$GOBIN/gitleaks" ]]; then
            go install "github.com/zricethezav/gitleaks/v8@$GITLEAKS_VERSION"
          fi
          echo "$GOBIN" >> "$GITHUB_PATH"
      - run: actionlint -shellcheck= .github/workflows/ci.yml
      - name: Validate scripts and whitespace
        run: |
          git diff-tree --check HEAD
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 - <<'PY'
          import ast, pathlib
          for path in pathlib.Path('scripts').glob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          PY
      - name: Scan every commit, including nested archives
        run: gitleaks git --log-opts=--all --max-archive-depth=10 --redact --no-banner .

  release:
    name: Build and verify four native archives
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: release-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ hashFiles('go.mod', 'go.sum', 'vendor/**', 'vendor/modules.txt', '*.go', 'scripts/build-binaries.sh') }}
          restore-keys: |
            release-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-
      - run: make release
      - run: python3 scripts/verify-releases.py bin/releases
      - name: Retain verified archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-archives
          path: bin/releases/*
          if-no-files-found: error
          retention-days: 14

  container:
    # The storage service is a deployable artifact, so its image is exercised as
    # a container rather than only compiled: authorization, document revisions,
    # the credential lease, restart durability, the volume contents, and two real
    # clients against it. The suite builds the image itself from this checkout.
    name: Broker container storage contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Restore the Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: broker-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ hashFiles('go.mod', 'go.sum', 'vendor/**', 'vendor/modules.txt', '*.go', 'internal/broker/**', 'cmd/ompig-slim-broker/**', 'Dockerfile.broker') }}
          restore-keys: |
            broker-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-
      - name: Test the image and the clients that use it
        run: make test-broker-container
      - name: Keep the container log on failure
        if: failure()
        run: docker logs ompig-slim-broker-test 2>&1 || true

  container-image:
    name: Publish the broker image for linux/amd64 and linux/arm64
    needs: [release, check, hygiene, container]
    # A release tag is the only trigger that may push an image: the tags it
    # publishes are what deployments pin, so a branch run must never create them.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # GHCR accepts the workflow token for pushes to this repository's package.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image name is derived from the repository owner, so a fork publishes
      # to its own namespace instead of attempting the upstream package.
      - name: Resolve image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ompig-slim-broker
          # metadata-action adds `latest` for a non-prerelease semver tag. The
          # minor and major moving tags are what an operator can safely pin.
          # The literal tag is also published so the pull command in the docs and
          # the step summary resolves for any tag spelling a release may use.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=ompig-slim-broker
            org.opencontainers.image.description=Hosted profile storage for ompig-slim: credentials and configuration only, never inference traffic
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.broker
          platforms: linux/amd64,linux/arm64
          push: true
          # The tag reaches the binary, so the published image reports the
          # same version the release archives do.
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The build stage cross-compiles, so repeat tags reuse the same layers.
          cache-from: type=gha,scope=broker-image
          cache-to: type=gha,mode=max,scope=broker-image
      - name: Publish the image reference
        run: |
          {
            echo '### Broker image'
            echo
            echo '```sh'
            echo "docker pull ghcr.io/${{ github.repository_owner }}/ompig-slim-broker:${{ github.ref_name }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Attach verified archives to the release
    needs: [release, check, hygiene, container]
    # Only a tag push creates a release; the installer's default
    # releases/latest/download URL resolves to the newest non-prerelease, so
    # branch and pull-request runs must never publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-archives
          path: assets
      # Re-verify before uploading: the checksums that the installer trusts are
      # only meaningful if the files they describe are the files this workflow
      # published. verify-releases.py asserts the tree relative to the repo.
      - run: python3 scripts/verify-releases.py assets
      - name: Create the release and attach archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" assets/*.tar.gz assets/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes
